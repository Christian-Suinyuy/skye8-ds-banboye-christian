repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.3
    hooks:
      - id: ruff
        args: [--fix]
        name: "running Ruff"
      - id: ruff-format
  
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black

  
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: "runing type check with my py"
  
  - repo: local
    hooks:
      - id: pytest
        name: "running pytest"
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false