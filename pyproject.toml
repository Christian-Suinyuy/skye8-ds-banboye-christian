[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-telimetry"
version = "0.1.0"
description = "Data cleaning and analysis utilities for agent telemetry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"pandas",
	"python-dotenv"
]

[project.optional-dependencies]
dev = [
	"black>=26.5.1",
	"mypy>=2.3.1",
	"pre-commit>=4.6.2",
	"pytest>=9.1.1",
	"ruff>=0.16.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
exclude = ["src/agent_telimetry/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["src/agent_telimetry/tests"]
