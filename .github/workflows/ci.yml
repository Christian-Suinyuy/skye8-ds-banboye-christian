name: CI

on:
    push:
        branches: [main, master, dev]
    pull_request:
        branches: [main, master, dev]

jobs:
    test-and-lint:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: agent_telimetry
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d agent_telimetry"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_STRING: postgresql://postgres:postgres@localhost:5432/agent_telimetry

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            
            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install -e .

            - name: Run Linter
              run: |
                ruff check .

            - name: Create database schema
              run: |
                PGPASSWORD=postgres psql \
                  -h localhost \
                  -U postgres \
                  -d agent_telimetry \
                  -f src/agent_telimetry/sql/schema.sql

            - name: Run Tests
              run: | 
                pytest -v --tb=short